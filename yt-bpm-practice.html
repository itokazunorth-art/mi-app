<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouTube BPM練習ツール</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px 60px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
    background: #f5f5f7;
    padding: 16px 16px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .topbar-spacer {
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin: 0;
    flex: 1;
    padding-right: 40px;
  }
  .menu-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #1d1d1f;
    color: #fff;
    font-size: 1.2rem;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-btn:hover { background: #333; }
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 999;
  }
  .drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    width: min(320px, 85vw);
    height: 100vh;
    background: #f5f5f7;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 1000;
    overflow-y: auto;
    padding: 20px 16px 40px;
  }
  .drawer.open {
    transform: translateX(0);
  }
  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .drawer-header h2 { margin: 0; }
  .icon-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: #1d1d1f;
    padding: 4px 10px;
    margin: 0;
    cursor: pointer;
    border-radius: 6px;
  }
  .icon-btn:hover { background: #e5e5ea; }
  .icon-btn.small { font-size: 1.1rem; padding: 4px 8px; }
  .drawer-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .drawer-toolbar select {
    flex: 1;
    width: auto;
  }
  .drawer-toolbar button {
    margin: 0;
    white-space: nowrap;
  }
  .folder-section {
    margin-bottom: 18px;
  }
  .folder-header {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .folder-toggle {
    flex: 1;
    text-align: left;
    background: none;
    border: none;
    padding: 6px 0;
    margin: 0;
    font-size: 0.95rem;
    font-weight: bold;
    color: #1d1d1f;
    cursor: pointer;
  }
  .item-folder-select {
    margin-top: 8px;
    font-size: 0.85rem;
    padding: 6px 8px;
  }
  h2 {
    font-size: 1.05rem;
    margin: 0 0 12px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .video-control-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .video-control-row button {
    margin: 0;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-header h2 { margin: 0; }
  .card.collapsed .card-header { margin-bottom: 0; }
  .card:not(.collapsed) .card-header { margin-bottom: 12px; }
  .card.collapsed .card-body { display: none; }
  .panel-toggle {
    flex-shrink: 0;
    background: none;
    border: none;
    font-size: 1.1rem;
    line-height: 1;
    color: #666;
    padding: 4px 8px;
    margin: 0;
    cursor: pointer;
    border-radius: 6px;
    transition: transform 0.15s ease;
  }
  .panel-toggle:hover { background: #e5e5ea; }
  .card.collapsed .panel-toggle { transform: rotate(-90deg); }
  label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin: 10px 0 4px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%;
    font-size: 1rem;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  button {
    font-size: 0.95rem;
    padding: 10px 16px;
    margin-top: 12px;
    margin-right: 8px;
    border: none;
    border-radius: 8px;
    background: #0071e3;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #0059b3; }
  button.secondary {
    background: #e5e5ea;
    color: #1d1d1f;
  }
  button.secondary:hover { background: #d5d5da; }
  button.danger {
    background: #ffe5e5;
    color: #d1242f;
  }
  button.danger:hover { background: #ffd0d0; }
  .player-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 12px;
  }
  .player-wrap iframe, #player {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .rate-info {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #444;
    line-height: 1.6;
  }
  .rate-info b { color: #0071e3; }
  .list-item {
    border: 1px solid #e5e5ea;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
  }
  .list-item .title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .list-item .meta {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 4px;
  }
  .list-item .memo {
    font-size: 0.85rem;
    color: #333;
    white-space: pre-wrap;
    margin-bottom: 8px;
  }
  .empty-msg {
    color: #888;
    font-size: 0.9rem;
    text-align: center;
    padding: 12px 0;
  }
  input[type="radio"] { width: auto; }
  input[type="checkbox"] { width: auto; }
  .radio-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    color: #1d1d1f;
    margin-top: 10px;
  }
  .loop-time {
    font-size: 0.85rem;
    color: #444;
    margin-top: 6px;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 0.95rem;
  }
  .metro-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
  }
  .beat-indicator {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #d5d5da;
    transition: background 0.05s linear, transform 0.05s linear;
    flex-shrink: 0;
  }
  .beat-indicator.beat { background: #0071e3; transform: scale(1.25); }
  .beat-indicator.accent { background: #ff9500; transform: scale(1.4); }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
    <button id="menuToggleBtn" class="menu-btn" aria-label="マイリストを開く">&#9776;</button>
    <h1>YouTube BPM練習ツール</h1>
  </div>
  <div class="topbar-spacer" id="topbarSpacer"></div>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="listDrawer" class="drawer">
    <div class="drawer-header">
      <h2>マイリスト</h2>
      <button id="drawerCloseBtn" class="icon-btn" aria-label="閉じる">&times;</button>
    </div>
    <div class="drawer-toolbar">
      <select id="sortSelect">
        <option value="updated_desc">追加順(新しい順)</option>
        <option value="updated_asc">追加順(古い順)</option>
        <option value="title_asc">タイトル順</option>
      </select>
      <button id="newFolderBtn" class="secondary">＋ フォルダ作成</button>
    </div>
    <label class="checkbox-label" style="margin-top:0;"><input type="checkbox" id="continuousPlayToggle"> フォルダ内で連続再生する</label>
    <div id="list"></div>
  </aside>

  <div class="card">
    <h2>動画読み込み</h2>
    <label for="videoUrl">YouTube URL</label>
    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    <button id="loadBtn">読み込む</button>
    <div class="player-wrap"><div id="player"></div></div>
    <label for="videoTitle">動画タイトル(自動取得・編集可)</label>
    <input type="text" id="videoTitle" placeholder="動画タイトル">
  </div>

  <div class="card video-control-row">
    <button id="seekBackBtn" class="secondary" aria-label="10秒戻る">-10秒</button>
    <button id="playPauseBtn" aria-label="再生・一時停止">&#9654; 再生</button>
    <button id="seekFwdBtn" class="secondary" aria-label="10秒進む">+10秒</button>
  </div>

  <div class="card" data-panel="speed">
    <div class="card-header">
      <h2>BPM連動スピード制御</h2>
      <button class="panel-toggle" aria-label="開閉">▼</button>
    </div>
    <div class="card-body">
      <div class="row">
        <div>
          <label for="originalBpm">原曲BPM</label>
          <input type="number" id="originalBpm" min="1" placeholder="例: 135">
        </div>
        <div>
          <label for="targetBpm">目標BPM</label>
          <input type="number" id="targetBpm" min="1" placeholder="例: 108">
        </div>
      </div>
      <button id="applyRateBtn">速度に反映</button>
      <button id="resetRateBtn" class="secondary">等速(1.0x)に戻す</button>
      <div class="rate-info" id="rateInfo">動画を読み込んでBPMを入力してください。</div>
    </div>
  </div>

  <div class="card" data-panel="loop">
    <div class="card-header">
      <h2>区間ループ (A-Bリピート)</h2>
      <button class="panel-toggle" aria-label="開閉">▼</button>
    </div>
    <div class="card-body">
      <div class="row">
        <div>
          <button id="setABtn" class="secondary">A地点を設定</button>
          <div class="loop-time" id="loopADisplay">A: 未設定</div>
        </div>
        <div>
          <button id="setBBtn" class="secondary">B地点を設定</button>
          <div class="loop-time" id="loopBDisplay">B: 未設定</div>
        </div>
      </div>
      <label class="checkbox-label"><input type="checkbox" id="loopEnabled"> ループ再生を有効にする</label>
      <button id="clearLoopBtn" class="secondary">A/Bをクリア</button>
    </div>
  </div>

  <div class="card" data-panel="metro">
    <div class="card-header">
      <h2>練習用メトロノーム</h2>
      <button class="panel-toggle" aria-label="開閉">▼</button>
    </div>
    <div class="card-body">
      <label class="radio-label"><input type="radio" name="metroMode" value="independent" checked> 独立モード(下のBPMで鳴らす)</label>
      <label class="radio-label"><input type="radio" name="metroMode" value="sync"> 動画同期モード(再生速度に自動追従)</label>
      <label for="metroBpm">BPM(独立モード時に使用)</label>
      <input type="number" id="metroBpm" min="20" max="300" value="120">
      <button id="tapTempoBtn" class="secondary">タップでBPM測定</button>
      <div class="rate-info" id="metroSyncInfo"></div>
      <button id="setBeatAnchorBtn" class="secondary">タップでクリックの先頭を設定</button>
      <div class="loop-time" id="beatAnchorDisplay">拍の基準: 未設定</div>
      <div class="metro-controls">
        <button id="metroToggleBtn">再生</button>
        <div class="beat-indicator" id="beatIndicator"></div>
      </div>
    </div>
  </div>

  <div class="card" data-panel="save">
    <div class="card-header">
      <h2>練習ログを保存</h2>
      <button class="panel-toggle" aria-label="開閉">▼</button>
    </div>
    <div class="card-body">
      <label for="folderSelect">フォルダ(セットリスト)</label>
      <select id="folderSelect"></select>
      <label for="memo">練習メモ</label>
      <textarea id="memo" placeholder="例: ベースのゴーストノート注意、Tab譜動画URLなど"></textarea>
      <button id="saveBtn">この曲を保存</button>
      <div class="empty-msg" style="padding:0;margin-top:10px;">保存済み一覧は左上の &#9776; メニューから確認できます。</div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'ytBpmPracticeList';
  let player = null;
  let playerReady = false;
  let availableRates = [1];
  let currentVideoId = null;
  let titleFilledForVideoId = null;
  let currentRate = 1;
  let lastIdealRate;
  let suppressFieldReset = false;
  let activePlaybackQueue = [];
  let activePlaybackIndex = -1;

  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/
    ];
    for (const re of patterns) {
      const m = url.match(re);
      if (m) return m[1];
    }
    return null;
  }

  function loadYouTubeApi() {
    if (window.YT && window.YT.Player) {
      createPlayer();
      return;
    }
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = createPlayer;
  }

  function createPlayer() {
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: currentVideoId,
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onPlaybackRateChange: onPlayerRateChange
      }
    });
  }

  function onPlayerReady() {
    playerReady = true;
    availableRates = player.getAvailablePlaybackRates();
    handleNewVideoIfReady();
  }

  function onPlayerStateChange(event) {
    handleNewVideoIfReady();
    updatePlayPauseIcon();
    if (event.data === YT.PlayerState.ENDED && document.getElementById('continuousPlayToggle').checked) {
      playNextInQueue();
    }
  }

  function setActivePlaybackQueueForItem(item) {
    const sorted = sortItems(loadList(), document.getElementById('sortSelect').value);
    const key = item.folderId || null;
    activePlaybackQueue = sorted.filter(i => (i.folderId || null) === key);
    activePlaybackIndex = activePlaybackQueue.findIndex(i => i.videoId === item.videoId);
  }

  function playNextInQueue() {
    if (activePlaybackIndex < 0 || activePlaybackIndex + 1 >= activePlaybackQueue.length) return;
    activePlaybackIndex += 1;
    loadSavedItem(activePlaybackQueue[activePlaybackIndex]);
  }

  function loadSavedItem(item) {
    suppressFieldReset = true;
    document.getElementById('videoUrl').value = item.url;
    document.getElementById('videoTitle').value = item.title || '';
    document.getElementById('originalBpm').value = item.originalBpm || '';
    document.getElementById('targetBpm').value = item.lastBpm || '';
    document.getElementById('memo').value = item.memo || '';
    refreshFolderSelectOptions(item.folderId || '');
    if (item.originalBpm) {
      document.getElementById('metroBpm').value = item.originalBpm;
    }
    document.getElementById('loadBtn').click();
  }

  function onPlayerRateChange(event) {
    currentRate = event.data;
    renderRateInfo();
    updateMetroSyncInfo();
    // 位相合わせ(resyncToVideoBeat)はここでは呼ばない: テンポはスケジューラーが
    // 毎回最新のBPMを読みに行くので自動で追従する。resyncは次のクリックを強制的に
    // ずらすため、速度を変えるたびに一瞬無音になってしまう。
  }

  function handleNewVideoIfReady() {
    if (!playerReady) return;
    const data = player.getVideoData();
    if (!data || data.video_id !== currentVideoId) return;
    if (titleFilledForVideoId === currentVideoId) return;
    titleFilledForVideoId = currentVideoId;
    lastIdealRate = undefined;
    player.setPlaybackRate(1);
    currentRate = player.getPlaybackRate();
    renderRateInfo();
    resetLoopPoints();
    syncAnchorContentTime = null;
    lastValidOriginalBpm = null;
    document.getElementById('beatAnchorDisplay').textContent = '拍の基準: 未設定';

    if (suppressFieldReset) {
      // マイリストからの読み込み: そのタイミングで曲自身の保存値(編集済み
      // タイトルを含む)が既にセットされているので、ここでは一切上書きしない
      suppressFieldReset = false;
    } else {
      // 手動でURLを入力しての読み込み: 前の曲の設定を引き継がない。
      // タイトルはYouTube取得値を使うが、この時点ではまだ取得できて
      // いないことがあるので、取れるまで少し待って再取得する。
      if (data.title) {
        document.getElementById('videoTitle').value = data.title;
      } else {
        document.getElementById('videoTitle').value = '';
        pollForVideoTitle(currentVideoId, 6);
      }
      document.getElementById('originalBpm').value = '';
      document.getElementById('targetBpm').value = '';
      document.getElementById('memo').value = '';
      document.getElementById('metroBpm').value = 120;
      document.getElementById('folderSelect').value = '';
    }

    updateMetroSyncInfo();
  }

  function pollForVideoTitle(videoId, attemptsLeft) {
    if (attemptsLeft <= 0 || currentVideoId !== videoId || !player) return;
    const data = player.getVideoData();
    if (data && data.video_id === videoId && data.title) {
      document.getElementById('videoTitle').value = data.title;
    } else {
      setTimeout(() => pollForVideoTitle(videoId, attemptsLeft - 1), 400);
    }
  }

  function closestRate(target) {
    return availableRates.reduce((best, r) =>
      Math.abs(r - target) < Math.abs(best - target) ? r : best
    , availableRates[0]);
  }

  function renderRateInfo() {
    const el = document.getElementById('rateInfo');
    if (!playerReady) {
      el.textContent = '動画を読み込んでBPMを入力してください。';
      return;
    }
    let text = `<b>現在の再生速度: ${currentRate}x</b>`;
    if (lastIdealRate !== undefined) {
      text += `<br>理想倍速(目標BPM ÷ 原曲BPM): ${lastIdealRate.toFixed(3)}x`;
      if (Math.abs(lastIdealRate - currentRate) > 0.001) {
        text += `<br>※YouTubeが対応する速度の都合で近似値(${currentRate}x)を適用しています。`;
      }
    }
    el.innerHTML = text;
  }

  const urlInput = document.getElementById('videoUrl');
  urlInput.addEventListener('focus', function () {
    this.select();
  });
  urlInput.addEventListener('mouseup', function (e) {
    e.preventDefault();
  });

  document.getElementById('loadBtn').addEventListener('click', () => {
    const url = document.getElementById('videoUrl').value.trim();
    const videoId = extractVideoId(url);
    if (!videoId) {
      alert('有効なYouTube URLを入力してください。');
      return;
    }
    currentVideoId = videoId;
    titleFilledForVideoId = null;
    if (!suppressFieldReset) {
      // 手動でのURL読み込み: マイリスト/連続再生のキューとは無関係になる
      activePlaybackQueue = [];
      activePlaybackIndex = -1;
    }
    if (!window.YT || !window.YT.Player) {
      loadYouTubeApi();
    } else if (!player) {
      createPlayer();
    } else {
      player.loadVideoById(videoId);
    }
  });

  document.getElementById('applyRateBtn').addEventListener('click', () => {
    if (!playerReady) {
      alert('先に動画を読み込んでください。');
      return;
    }
    const original = parseFloat(document.getElementById('originalBpm').value);
    const target = parseFloat(document.getElementById('targetBpm').value);
    if (!original || !target || original <= 0 || target <= 0) {
      alert('原曲BPMと目標BPMを正しく入力してください。');
      return;
    }
    const idealRate = target / original;
    const rate = closestRate(idealRate);
    lastIdealRate = idealRate;
    player.setPlaybackRate(rate);
    currentRate = player.getPlaybackRate();
    renderRateInfo();
  });

  document.getElementById('resetRateBtn').addEventListener('click', () => {
    if (!playerReady) return;
    lastIdealRate = undefined;
    player.setPlaybackRate(1);
    currentRate = player.getPlaybackRate();
    renderRateInfo();
  });

  // --- A-Bリピート(区間ループ) ---
  const MIN_LOOP_GAP = 0.5; // 秒。これより短い区間は作らせない
  let loopA = null;
  let loopB = null;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function resetLoopPoints() {
    loopA = null;
    loopB = null;
    document.getElementById('loopEnabled').checked = false;
    document.getElementById('loopADisplay').textContent = 'A: 未設定';
    document.getElementById('loopBDisplay').textContent = 'B: 未設定';
  }

  document.getElementById('setABtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    const candidate = player.getCurrentTime();
    if (loopB !== null && loopB - candidate < MIN_LOOP_GAP) {
      // 新しいA地点と矛盾するB地点は無効化し、後勝ちで設定し直せるようにする
      loopB = null;
      document.getElementById('loopBDisplay').textContent = 'B: 未設定';
    }
    loopA = candidate;
    document.getElementById('loopADisplay').textContent = `A: ${formatTime(loopA)}`;
  });

  document.getElementById('setBBtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    const candidate = player.getCurrentTime();
    if (loopA !== null && candidate - loopA < MIN_LOOP_GAP) {
      // 新しいB地点と矛盾するA地点は無効化し、後勝ちで設定し直せるようにする
      loopA = null;
      document.getElementById('loopADisplay').textContent = 'A: 未設定';
    }
    loopB = candidate;
    document.getElementById('loopBDisplay').textContent = `B: ${formatTime(loopB)}`;
  });

  document.getElementById('clearLoopBtn').addEventListener('click', resetLoopPoints);

  setInterval(() => {
    if (!playerReady) return;
    if (!document.getElementById('loopEnabled').checked) return;
    if (loopB === null) return;
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    if (player.getCurrentTime() >= loopB) {
      player.seekTo(loopA || 0, true);
    }
  }, 200);

  // --- 練習用メトロノーム ---
  let audioCtx = null;
  let metroTimerId = null;
  let isMetroPlaying = false;
  let nextNoteTime = 0;
  let beatInBar = 0;
  const BEATS_PER_BAR = 4;
  const SCHEDULE_AHEAD_TIME = 0.1;
  const LOOKAHEAD_MS = 25;
  let tapTimestamps = [];
  let syncAnchorContentTime = null;
  let lastValidOriginalBpm = null;

  function getMetroMode() {
    return document.querySelector('input[name="metroMode"]:checked').value;
  }

  function getEffectiveOriginalBpm() {
    const raw = parseFloat(document.getElementById('originalBpm').value);
    if (raw > 0) {
      lastValidOriginalBpm = raw;
      return raw;
    }
    // 入力中で一時的に空欄になっている場合など、直前の有効値を使い続ける
    return lastValidOriginalBpm;
  }

  function getSyncedBpm() {
    const original = getEffectiveOriginalBpm();
    if (!original || !playerReady) return null;
    return original * currentRate;
  }

  function getMetronomeBpm() {
    if (getMetroMode() === 'sync') {
      const synced = getSyncedBpm();
      return synced || parseFloat(document.getElementById('metroBpm').value) || 120;
    }
    return parseFloat(document.getElementById('metroBpm').value) || 120;
  }

  function updateMetroSyncInfo() {
    const el = document.getElementById('metroSyncInfo');
    if (getMetroMode() === 'sync') {
      const synced = getSyncedBpm();
      if (!synced) {
        el.innerHTML = '原曲BPMを入力し、動画を読み込むと自動追従します。';
      } else if (syncAnchorContentTime === null) {
        el.innerHTML = `<b>動画同期BPM: ${synced.toFixed(1)}</b>(原曲BPM × 現在の再生速度)<br>※クリックの先頭は自動検出されません。曲に合わせて「タップでクリックの先頭を設定」を押したタイミングが基準になります。`;
      } else {
        el.innerHTML = `<b>動画同期BPM: ${synced.toFixed(1)}</b>(原曲BPM × 現在の再生速度)`;
      }
    } else {
      el.textContent = '';
    }
  }

  document.querySelectorAll('input[name="metroMode"]').forEach(el => {
    el.addEventListener('change', () => {
      updateMetroSyncInfo();
      resyncToVideoBeat();
    });
  });
  document.getElementById('originalBpm').addEventListener('input', updateMetroSyncInfo);

  function resyncToVideoBeat() {
    if (!audioCtx || !isMetroPlaying) return;
    if (getMetroMode() !== 'sync') return;
    if (syncAnchorContentTime === null || !playerReady) return;
    const originalBpm = getEffectiveOriginalBpm();
    if (!originalBpm) return;
    const beatIntervalContent = 60 / originalBpm;
    const videoNow = player.getCurrentTime();
    let phase = (videoNow - syncAnchorContentTime) % beatIntervalContent;
    if (phase < 0) phase += beatIntervalContent;
    const contentToNextBeat = (beatIntervalContent - phase) % beatIntervalContent;
    const wallToNextBeat = contentToNextBeat / (currentRate || 1);
    nextNoteTime = audioCtx.currentTime + wallToNextBeat;
    beatInBar = 0;
  }

  document.getElementById('setBeatAnchorBtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    syncAnchorContentTime = player.getCurrentTime();
    document.getElementById('beatAnchorDisplay').textContent = `拍の基準: ${formatTime(syncAnchorContentTime)}`;
    updateMetroSyncInfo();
    resyncToVideoBeat();
  });

  function scheduleClick(beatNumber, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = beatNumber === 0 ? 1600 : 1000;
    gain.gain.setValueAtTime(0.9, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.05);

    const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
    setTimeout(() => flashBeat(beatNumber === 0), delayMs);
  }

  function flashBeat(accent) {
    const el = document.getElementById('beatIndicator');
    el.className = 'beat-indicator ' + (accent ? 'accent' : 'beat');
    setTimeout(() => { el.className = 'beat-indicator'; }, 100);
  }

  function metroScheduler() {
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_TIME) {
      scheduleClick(beatInBar, nextNoteTime);
      const bpm = getMetronomeBpm();
      nextNoteTime += 60.0 / bpm;
      beatInBar = (beatInBar + 1) % BEATS_PER_BAR;
    }
    metroTimerId = setTimeout(metroScheduler, LOOKAHEAD_MS);
  }

  document.getElementById('metroToggleBtn').addEventListener('click', () => {
    if (isMetroPlaying) {
      isMetroPlaying = false;
      clearTimeout(metroTimerId);
      document.getElementById('metroToggleBtn').textContent = '再生';
      return;
    }
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isMetroPlaying = true;
    beatInBar = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    resyncToVideoBeat();
    metroScheduler();
    document.getElementById('metroToggleBtn').textContent = '停止';
  });

  document.getElementById('tapTempoBtn').addEventListener('click', () => {
    const now = performance.now();
    if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 2000) {
      tapTimestamps = [];
    }
    tapTimestamps.push(now);
    if (tapTimestamps.length > 8) tapTimestamps.shift();
    if (tapTimestamps.length >= 2) {
      const intervals = [];
      for (let i = 1; i < tapTimestamps.length; i++) {
        intervals.push(tapTimestamps[i] - tapTimestamps[i - 1]);
      }
      const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const bpm = Math.round(60000 / avgMs);
      document.getElementById('metroBpm').value = bpm;
    }
  });

  updateMetroSyncInfo();

  // 固定ヘッダーの実高さ分だけ、後続コンテンツを押し下げる
  function syncTopbarSpacerHeight() {
    document.getElementById('topbarSpacer').style.height =
      document.getElementById('topbar').offsetHeight + 'px';
  }
  syncTopbarSpacerHeight();
  window.addEventListener('resize', syncTopbarSpacerHeight);

  // --- マイリストのドロワー(左スライドパネル) ---
  const listDrawer = document.getElementById('listDrawer');
  const drawerOverlay = document.getElementById('drawerOverlay');

  function openDrawer() {
    // 拡大表示で横にパンしていると、position:fixedのドロワーが画面外に
    // ズレて見えることがあるため、開く前に横スクロール位置をリセットする
    window.scrollTo({ left: 0, top: window.scrollY, behavior: 'auto' });
    listDrawer.classList.add('open');
    drawerOverlay.classList.add('open');
  }

  function closeDrawer() {
    listDrawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }

  document.getElementById('menuToggleBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);

  const FOLDERS_KEY = 'ytBpmFolders';
  const SORT_KEY = 'ytBpmSortOrder';
  const COLLAPSED_FOLDERS_KEY = 'ytBpmCollapsedFolders';

  function loadCollapsedFolders() {
    try {
      return new Set(JSON.parse(localStorage.getItem(COLLAPSED_FOLDERS_KEY)) || []);
    } catch {
      return new Set();
    }
  }

  function saveCollapsedFolders() {
    localStorage.setItem(COLLAPSED_FOLDERS_KEY, JSON.stringify([...collapsedFolders]));
  }

  const collapsedFolders = loadCollapsedFolders();

  function loadList() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveList(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function loadFolders() {
    try {
      return JSON.parse(localStorage.getItem(FOLDERS_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveFolders(folders) {
    localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
  }

  function makeFolderId() {
    return window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function buildFolderOptionsHtml(selectedId) {
    const folders = loadFolders();
    let html = `<option value=""${!selectedId ? ' selected' : ''}>未分類</option>`;
    folders.forEach(f => {
      html += `<option value="${f.id}"${selectedId === f.id ? ' selected' : ''}>${escapeHtml(f.name)}</option>`;
    });
    return html;
  }

  function refreshFolderSelectOptions(selectedId) {
    const sel = document.getElementById('folderSelect');
    const current = selectedId !== undefined ? selectedId : sel.value;
    sel.innerHTML = buildFolderOptionsHtml(current) + '<option value="__new__">＋ 新しいフォルダを作成</option>';
    sel.value = current || '';
  }

  document.getElementById('folderSelect').addEventListener('change', function () {
    if (this.value !== '__new__') return;
    const name = prompt('新しいフォルダ(セットリスト)名を入力してください');
    if (name && name.trim()) {
      const folders = loadFolders();
      const id = makeFolderId();
      folders.push({ id, name: name.trim() });
      saveFolders(folders);
      refreshFolderSelectOptions(id);
      renderList();
    } else {
      refreshFolderSelectOptions('');
    }
  });

  document.getElementById('newFolderBtn').addEventListener('click', () => {
    const name = prompt('新しいフォルダ(セットリスト)名を入力してください');
    if (!name || !name.trim()) return;
    const folders = loadFolders();
    folders.push({ id: makeFolderId(), name: name.trim() });
    saveFolders(folders);
    renderList();
  });

  document.getElementById('sortSelect').addEventListener('change', function () {
    localStorage.setItem(SORT_KEY, this.value);
    renderList();
  });

  function sortItems(list, order) {
    const copy = [...list];
    if (order === 'updated_asc') {
      copy.sort((a, b) => a.updatedAt - b.updatedAt);
    } else if (order === 'title_asc') {
      copy.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ja'));
    } else {
      copy.sort((a, b) => b.updatedAt - a.updatedAt);
    }
    return copy;
  }

  function renderListItem(item) {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="title">${escapeHtml(item.title || '(タイトル未設定)')}</div>
      <div class="meta">原曲BPM: ${item.originalBpm ?? '-'} / 直近の練習BPM: ${item.lastBpm ?? '-'}</div>
      ${item.memo ? `<div class="memo">${escapeHtml(item.memo)}</div>` : ''}
    `;

    const folderMoveSelect = document.createElement('select');
    folderMoveSelect.className = 'item-folder-select';
    folderMoveSelect.setAttribute('aria-label', 'フォルダを移動');
    folderMoveSelect.innerHTML = buildFolderOptionsHtml(item.folderId || '');
    folderMoveSelect.addEventListener('change', () => {
      const list = loadList();
      const target = list.find(i => i.videoId === item.videoId);
      if (target) {
        target.folderId = folderMoveSelect.value || null;
        saveList(list);
        renderList();
      }
    });
    div.appendChild(folderMoveSelect);

    const loadBtn = document.createElement('button');
    loadBtn.className = 'secondary';
    loadBtn.textContent = '読み込む';
    loadBtn.addEventListener('click', () => {
      setActivePlaybackQueueForItem(item);
      loadSavedItem(item);
      closeDrawer();
    });
    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '削除';
    delBtn.addEventListener('click', () => {
      if (!confirm('この曲を削除しますか？')) return;
      const updated = loadList().filter(i => i.videoId !== item.videoId);
      saveList(updated);
      renderList();
    });
    div.appendChild(loadBtn);
    div.appendChild(delBtn);
    return div;
  }

  function renderFolderSection(folder, items) {
    const isUnclassified = folder === null;
    const folderKey = isUnclassified ? '__none__' : folder.id;
    const collapsed = collapsedFolders.has(folderKey);

    const section = document.createElement('div');
    section.className = 'folder-section';

    const header = document.createElement('div');
    header.className = 'folder-header';

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'folder-toggle';
    toggleBtn.textContent = `${collapsed ? '▶' : '▼'} ${isUnclassified ? '未分類' : folder.name} (${items.length})`;
    toggleBtn.addEventListener('click', () => {
      if (collapsedFolders.has(folderKey)) collapsedFolders.delete(folderKey);
      else collapsedFolders.add(folderKey);
      saveCollapsedFolders();
      renderList();
    });
    header.appendChild(toggleBtn);

    if (!isUnclassified) {
      const renameBtn = document.createElement('button');
      renameBtn.className = 'icon-btn small';
      renameBtn.textContent = '✎';
      renameBtn.setAttribute('aria-label', 'フォルダ名を変更');
      renameBtn.addEventListener('click', () => {
        const newName = prompt('フォルダ名を変更', folder.name);
        if (!newName || !newName.trim()) return;
        const folders = loadFolders();
        const f = folders.find(x => x.id === folder.id);
        if (f) {
          f.name = newName.trim();
          saveFolders(folders);
          renderList();
        }
      });
      const delFolderBtn = document.createElement('button');
      delFolderBtn.className = 'icon-btn small';
      delFolderBtn.textContent = '🗑';
      delFolderBtn.setAttribute('aria-label', 'フォルダを削除');
      delFolderBtn.addEventListener('click', () => {
        if (!confirm(`「${folder.name}」を削除しますか？(中の曲は未分類に移動します)`)) return;
        saveFolders(loadFolders().filter(f => f.id !== folder.id));
        const list = loadList().map(i => (i.folderId === folder.id ? { ...i, folderId: null } : i));
        saveList(list);
        renderList();
      });
      header.appendChild(renameBtn);
      header.appendChild(delFolderBtn);
    }

    section.appendChild(header);

    if (!collapsed) {
      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-msg';
        empty.textContent = '曲がありません。';
        section.appendChild(empty);
      } else {
        items.forEach(item => section.appendChild(renderListItem(item)));
      }
    }
    return section;
  }

  function renderList() {
    const list = loadList();
    const folders = loadFolders();
    const container = document.getElementById('list');
    container.innerHTML = '';
    if (list.length === 0 && folders.length === 0) {
      container.innerHTML = '<div class="empty-msg">保存された曲はまだありません。</div>';
      return;
    }

    const sortOrder = document.getElementById('sortSelect').value;
    const sorted = sortItems(list, sortOrder);

    const byFolder = new Map();
    sorted.forEach(item => {
      const key = item.folderId || '__none__';
      if (!byFolder.has(key)) byFolder.set(key, []);
      byFolder.get(key).push(item);
    });

    folders.forEach(folder => {
      container.appendChild(renderFolderSection(folder, byFolder.get(folder.id) || []));
    });

    const unclassified = byFolder.get('__none__') || [];
    if (unclassified.length > 0 || folders.length === 0) {
      container.appendChild(renderFolderSection(null, unclassified));
    }
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!currentVideoId) {
      alert('先に動画を読み込んでください。');
      return;
    }
    const url = document.getElementById('videoUrl').value.trim();
    const title = document.getElementById('videoTitle').value.trim();
    const originalBpm = document.getElementById('originalBpm').value;
    const lastBpm = document.getElementById('targetBpm').value;
    const memo = document.getElementById('memo').value;
    const folderId = document.getElementById('folderSelect').value || null;

    const list = loadList();
    const existingIndex = list.findIndex(i => i.videoId === currentVideoId);
    const item = {
      videoId: currentVideoId,
      url,
      title,
      originalBpm: originalBpm ? Number(originalBpm) : null,
      lastBpm: lastBpm ? Number(lastBpm) : null,
      memo,
      folderId,
      updatedAt: Date.now()
    };
    if (existingIndex >= 0) {
      list[existingIndex] = item;
    } else {
      list.push(item);
    }
    saveList(list);
    renderList();
  });

  const savedSortOrder = localStorage.getItem(SORT_KEY);
  if (savedSortOrder) {
    document.getElementById('sortSelect').value = savedSortOrder;
  }
  refreshFolderSelectOptions('');
  renderList();

  const CONTINUOUS_PLAY_KEY = 'ytBpmContinuousPlay';
  const continuousPlayToggle = document.getElementById('continuousPlayToggle');
  continuousPlayToggle.checked = localStorage.getItem(CONTINUOUS_PLAY_KEY) === 'true';
  continuousPlayToggle.addEventListener('change', () => {
    localStorage.setItem(CONTINUOUS_PLAY_KEY, continuousPlayToggle.checked);
  });

  // --- 動画コントロール(-10秒/再生/+10秒) ---
  function updatePlayPauseIcon() {
    if (!playerReady) return;
    const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
    document.getElementById('playPauseBtn').innerHTML = playing ? '&#10074;&#10074; 一時停止' : '&#9654; 再生';
  }

  document.getElementById('seekBackBtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    player.seekTo(Math.max(0, player.getCurrentTime() - 10), true);
  });

  document.getElementById('seekFwdBtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    const duration = player.getDuration();
    const target = player.getCurrentTime() + 10;
    player.seekTo(duration ? Math.min(duration, target) : target, true);
  });

  document.getElementById('playPauseBtn').addEventListener('click', () => {
    if (!playerReady) { alert('先に動画を読み込んでください。'); return; }
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  // --- パネルの開閉 ---
  // 開閉状態は保存しない: リロードするたびに必ず初期状態(全て閉じた状態)に戻す
  document.querySelectorAll('.card[data-panel]').forEach(card => {
    card.classList.add('collapsed');
    card.querySelector('.panel-toggle').addEventListener('click', () => {
      card.classList.toggle('collapsed');
    });
  });
</script>
</body>
</html>
